plugins {
    id 'java'
}

group = 'com.cedaniel200'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    seleniumVersion = '4.33.0'
    cucumberVersion = '8.0.4'
    junitPlatformVersion = '6.1.3'
}

dependencies {
    implementation "org.seleniumhq.selenium:selenium-java:$seleniumVersion"
    implementation "io.cucumber:cucumber-java:$cucumberVersion"

    testImplementation "io.cucumber:cucumber-junit-platform-engine:$cucumberVersion"
    testImplementation "org.junit.platform:junit-platform-suite:$junitPlatformVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"

    // Cucumber 8 necesita Jackson para los formatters HTML y JSON.
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.4'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'base.url', System.getProperty('base.url', 'https://www.saucedemo.com')
    systemProperty 'webdriver.driver', System.getProperty('webdriver.driver', 'chrome')
    systemProperty 'headless', System.getProperty('headless', 'true')
    systemProperty 'webdriver.remote.url', System.getenv('WEBDRIVER_REMOTE_URL') ?: System.getProperty('webdriver.remote.url', '')
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
